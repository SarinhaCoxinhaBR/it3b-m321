# Ausbaustufe 2: Broker, chat-service, Datenbank und batch-writer.
# Keycloak, web-gateway und load-generator kommen in den folgenden
# Schritten dazu.
services:

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    networks:
      - chat-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  chat-service:
    build:
      context: .
      dockerfile: chat-service/Dockerfile
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - chat-net

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Benanntes Volume: die Daten überleben ein "docker compose down".
      # Erst "down -v" löscht sie.
      - postgres-data:/var/lib/postgresql/data
    networks:
      - chat-net
    healthcheck:
      # Über TCP (-h 127.0.0.1) und nicht über den Unix-Socket: beim ersten
      # Start läuft kurz ein Hilfsserver nur am Socket, der die Datenbank
      # noch anlegt. Über TCP antwortet erst der richtige Server.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  batch-writer:
    build:
      context: .
      dockerfile: batch-writer/Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      BATCH_WRITER_BATCH_SIZE: ${BATCH_WRITER_BATCH_SIZE:-500}
      BATCH_WRITER_BATCH_TIMEOUT_MS: ${BATCH_WRITER_BATCH_TIMEOUT_MS:-200}
      BATCH_WRITER_RETRY_DELAY_MS: ${BATCH_WRITER_RETRY_DELAY_MS:-2000}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # Stürzt der Dienst ab, startet Docker ihn neu. Wer ihn von Hand stoppt
    # (Szenario S4), dem startet Docker ihn nicht hinter dem Rücken wieder.
    restart: unless-stopped
    # Bewusst kein container_name: sonst scheitert
    # "docker compose up --scale batch-writer=2" (Szenario S6).
    networks:
      - chat-net

# Kein Dienst in dieser Datei veröffentlicht einen Port auf den Host.
# Der einzige offene Port des Gesamtsystems gehört später dem web-gateway.
volumes:
  postgres-data:

networks:
  chat-net:
    name: chat-net
